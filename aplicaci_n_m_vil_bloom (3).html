    class AmbientSoundEngine {
      constructor() {
        this.ctx = null;
        this.nodes = [];
        this.isPlaying = false;
        this.currentTrack = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      stop() {
        this.nodes.forEach(n => {
          try { n.stop ? n.stop() : n.disconnect(); } catch (e) {}
        });
        this.nodes = [];
        this.isPlaying = false;
        this.currentTrack = null;
      }

      playRain() {
        this.init();
        this.stop();
        const bufferSize = this.ctx.sampleRate * 2;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }
        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 750;

        const gainNode = this.ctx.createGain();
        gainNode.gain.setValueAtTime(0.12, this.ctx.currentTime);

        whiteNoise.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(this.ctx.destination);

        whiteNoise.start();
        this.nodes.push(whiteNoise, filter, gainNode);
        this.isPlaying = true;
        this.currentTrack = 'rain';
      }

      playCalmDrone() {
        this.init();
        this.stop();
        const frequencies = [220, 277.18, 329.63, 440];
        const gainNode = this.ctx.createGain();
        gainNode.gain.setValueAtTime(0.07, this.ctx.currentTime);

        frequencies.forEach(f => {
          const osc = this.ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, this.ctx.currentTime);
          osc.connect(gainNode);
          osc.start();
          this.nodes.push(osc);
        });

        gainNode.connect(this.ctx.destination);
        this.nodes.push(gainNode);
        this.isPlaying = true;
        this.currentTrack = 'drone';
      }

      playSingingBowl() {
        this.init();
        this.stop();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(432, this.ctx.currentTime);

        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 6);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        this.nodes.push(osc, gain);
        this.isPlaying = true;
        this.currentTrack = 'bowl';
      }
    }

    // --- PERSISTENCIA Y CARGA INICIAL ---
    function initApp() {
      try {
        const saved = localStorage.getItem('bloom_user_profile_es_v4');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed.userName) state.userName = parsed.userName;
          if (parsed.answers) state.answers = parsed.answers;
          if (parsed.moodCalendar) state.moodCalendar = parsed.moodCalendar;
          if (parsed.streak) state.streak = parsed.streak;
        } else {
          state.streak = { count: 1, lastLoginDate: '2026-09-03', totalLogins: 1 };
        }
      } catch (e) {}

      setupGlobalEvents();
      render();
    }

    function saveProfile() {
      try {
        const data = {
          userName: state.userName || 'Amiga Bloom',
          answers: state.answers,
          streak: state.streak,
          moodCalendar: state.moodCalendar,
          updatedAt: new Date().toISOString()
        };
        localStorage.setItem('bloom_user_profile_es_v4', JSON.stringify(data));
      } catch (e) {}
    }

    function showToast(text) {
      const el = document.getElementById('toast-container');
      const textEl = document.getElementById('toast-text');
      if (el && textEl) {
        textEl.innerText = text;
        el.classList.remove('opacity-0', 'translate-y-[-10px]');
        el.classList.add('opacity-100', 'translate-y-0');
        setTimeout(() => {
          el.classList.remove('opacity-100', 'translate-y-0');
          el.classList.add('opacity-0', 'translate-y-[-10px]');
        }, 2800);
      }
    }

    function navigateTo(screen) {
      state.currentScreen = screen;
      render();
      window.scrollTo(0, 0);

      setTimeout(generateQRCodes, 100);
    }

    function setupGlobalEvents() {
      document.getElementById('btn-back').addEventListener('click', () => navigateTo('dashboard'));
      document.getElementById('btn-header-profile').addEventListener('click', () => navigateTo('profile'));
      document.getElementById('btn-quick-checkin').addEventListener('click', () => {
        navigateTo('emotional');
        showToast('¡Selecciona tu emoción del día en el calendario!');
      });

      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', () => {
          const targetScreen = btn.getAttribute('data-screen');
          navigateTo(targetScreen);
        });
      });
    }

    function startAssessmentWithName() {
      const input = document.getElementById('initial-name-input');
      const enteredName = input ? input.value.trim() : '';
      state.userName = enteredName || 'Amiga Bloom';
      saveProfile();
      state.assessmentStep = 0;
      navigateTo('assessment');
    }

    // --- GENERADOR DE CÓDIGOS QR QUE REDIRIGEN A LA WEB OFICIAL ---
    function generateQRCodes() {
      const refQrContainer = document.getElementById('qr-code-references');
      if (refQrContainer && window.QRCode) {
        refQrContainer.innerHTML = '';
        new QRCode(refQrContainer, {
          text: EXTERNAL_INFO_URL,
          width: 96,
          height: 96,
          colorDark: "#6b21a8",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      }

      const manualQrContainer = document.getElementById('qr-code-manual');
      if (manualQrContainer && window.QRCode) {
        manualQrContainer.innerHTML = '';
        new QRCode(manualQrContainer, {
          text: EXTERNAL_INFO_URL,
          width: 80,
          height: 80,
          colorDark: "#881337",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      }
    }

    // --- MOTOR DE RENDERIZADO ---
    function render() {
      const container = document.getElementById('screen-container');
      const header = document.getElementById('main-header');
      const nav = document.getElementById('bottom-nav');
      const isMoon = state.currentScreen === 'moon';

      if (['onboarding', 'assessment', 'processing'].includes(state.currentScreen)) {
        header.classList.add('hidden');
        nav.classList.add('hidden');
      } else {
        header.classList.remove('hidden');
        nav.classList.remove('hidden');

        const btnBack = document.getElementById('btn-back');
        if (state.currentScreen !== 'dashboard') {
          btnBack.classList.remove('hidden');
        } else {
          btnBack.classList.add('hidden');
        }

        if (isMoon) {
          header.className = "sticky top-0 z-40 px-4 py-3 pt-safe border-b transition-colors duration-300 flex items-center justify-between backdrop-blur-md bg-[#1A1733]/90 border-purple-900/40 text-purple-100";

            btn.className = `nav-item flex flex-col items-center py-1 px-3 rounded-2xl transition-all duration-200 ${

        case 'onboarding': container.innerHTML = renderOnboarding(); break;

        case 'manual': container.innerHTML = renderManualBook(); break;
        case 'dashboard': container.innerHTML = renderDashboard(); break;
        case 'physical': container.innerHTML = renderPhysical(); break;
        case 'emotional': container.innerHTML = renderEmotional(); break;
        case 'audio': container.innerHTML = renderAudio(); break;
        case 'moon': container.innerHTML = renderMoonCalendar(); break;
        case 'habits': container.innerHTML = renderHabits(); break;
        case 'profile': container.innerHTML = renderProfile(); break;

      lucide.createIcons();
    }

      const isValid = selected.length > 0;
      const displayName = state.userName || 'Amiga Bloom';

      return `

                    isSel ? 'bg-gradient-to-r from-rose-50 to-purple-50 border-rose-400 shadow-md ring-2 ring-rose-300/50' : 'bg-white/90 border-slate-200/80 hover:border-rose-200'

                        <div class="text-xs font-semibold text-slate-800">${opt.label}</div>
                        <div class="text-[11px] text-slate-500 mt-0.5 font-normal leading-tight">${opt.desc}</div>

                    </div>

                      ${isSel ? '<i data-lucide="check" class="w-3 h-3"></i>' : ''}

                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <div class="pt-3 pb-2 flex items-center space-x-3">

              <i data-lucide="chevron-left" class="w-4 h-4"></i>
              <span>Atrás</span>
            </button>

            </button>

      `;

    function handleOptionSelect(label) {
      const q = ASSESSMENT_QUESTIONS[state.assessmentStep];
      const cur = state.answers[q.id] || [];

      if (q.type === 'single') {
        state.answers[q.id] = [label];
      } else {
        if (cur.includes(label)) {
          state.answers[q.id] = cur.filter(x => x !== label);
        } else {
          state.answers[q.id] = [...cur, label];
        }
      }
      render();
    }

    function handleNextAssessment() {
      if (state.assessmentStep < ASSESSMENT_QUESTIONS.length - 1) {
        state.assessmentStep++;
        render();
      } else {
        saveProfile();
        navigateTo('processing');
        setTimeout(() => navigateTo('manual'), 2200);
      }
    }

    function handlePrevAssessment() {
      if (state.assessmentStep > 0) {
        state.assessmentStep--;
        render();
      } else {
        navigateTo('onboarding');
      }
    }

                <input id="emotion-note-input" type="text" value="${dayData.note || ''}" placeholder="Escribe un pensamiento para hoy..." class="flex-1 px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-purple-400" />
                <button onclick="saveDayNote(${selectedDay})" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-xl text-xs font-semibold shadow-sm">
                  Guardar
                </button>
              </div>
            </div>
          </div>

          <div class="bg-white rounded-3xl p-6 border border-purple-100 shadow-sm mb-5 text-center">
            <span class="text-xs uppercase tracking-wider text-purple-600 font-semibold bg-purple-50 px-3 py-1 rounded-full">
              Respiración Guiada 4-7-8
            </span>
            <p class="text-xs text-slate-500 mt-2">Técnica para desactivar el sistema nervioso simpático y calmar la mente.</p>

            <div class="my-6 relative flex items-center justify-center">
              <div id="breathing-circle" class="w-36 h-36 rounded-full border-4 border-purple-300 flex items-center justify-center transition-all duration-1000 bg-purple-50/50">
                <div class="text-center">
                  <div id="breathing-timer" class="text-2xl font-serif font-bold text-purple-900">${state.breathingActive ? state.breathingTimer : 'Iniciar'}</div>
                  <div id="breathing-phase" class="text-xs text-purple-700 font-medium mt-0.5">${state.breathingActive ? state.breathingPhase : 'Toca abajo'}</div>
                </div>
              </div>
            </div>

            <button onclick="toggleBreathing()" class="px-6 py-2.5 rounded-2xl font-medium text-xs shadow-md text-white ${state.breathingActive ? 'bg-rose-500' : 'bg-purple-600'}">
              ${state.breathingActive ? 'Pausar Respiración' : 'Comenzar Sesión'}
            </button>
          </div>
        </div>
      `;
    }

    function selectEmotionDay(day) {
      state.selectedEmotionDate = day;
      render();
    }

    function saveDayEmotion(day, typeId, emoji) {
      if (!state.moodCalendar[day]) {
        state.moodCalendar[day] = { emoji, typeId, note: '' };
      } else {
        state.moodCalendar[day].typeId = typeId;
        state.moodCalendar[day].emoji = emoji;
      }
      saveProfile();
      showToast(`Emoción guardada para el día ${day} de Septiembre`);
      render();
    }

    function saveDayNote(day) {
      const input = document.getElementById('emotion-note-input');
      if (input) {
        if (!state.moodCalendar[day]) {
          state.moodCalendar[day] = { emoji: '🌸', typeId: 'serene', note: input.value };
        } else {
          state.moodCalendar[day].note = input.value;
        }
        saveProfile();
        showToast('Nota guardada con éxito 🌸');
        render();
      }
    }

    function renderMoonCalendar() {
      const selectedDay = state.selectedMoonDate || 3;
      const phaseObj = SEPTEMBER_MOON_DATA[selectedDay] || MOON_PHASES[0];

      const daysArray = Array.from({ length: 30 }, (_, i) => i + 1);

      return `
        <div class="min-h-screen bg-[#1A1733] text-purple-100 pb-24 p-4 max-w-md mx-auto">
          <div class="mb-4">
            <span class="px-3 py-1 rounded-full bg-purple-900/80 text-amber-300 text-xs font-semibold border border-purple-700">Ciclos Naturales</span>
            <h1 class="text-2xl font-serif font-bold text-white mt-1">Calendario Lunar 🌙</h1>
            <p class="text-xs text-purple-300 font-light mt-0.5 leading-relaxed">
              Explora las 8 fases lunares de Septiembre 2026 y ajusta tu autocuidado al ritmo cósmico.
            </p>
          </div>

          <div class="bg-[#2A264D] p-6 rounded-3xl border border-purple-500/30 text-center mb-5 shadow-xl relative overflow-hidden">
            <div class="absolute -right-6 -top-6 w-24 h-24 bg-purple-500/10 rounded-full blur-xl"></div>
            <span class="text-6xl inline-block transform hover:scale-110 transition-transform">${phaseObj.emoji}</span>
            <h2 class="text-xl font-serif font-bold text-white mt-2">${phaseObj.name}</h2>
            <p class="text-xs text-amber-300 font-medium mt-0.5">${selectedDay} de Septiembre, 2026</p>

            <div class="mt-4 pt-4 border-t border-purple-800/60 grid grid-cols-1 gap-2 text-left text-xs">
              <div class="bg-[#1E1B3A] p-3 rounded-2xl border border-purple-900">
                <span class="text-purple-300 font-bold block mb-0.5">🌱 Simbolismo y Energía:</span>
                <p class="text-purple-100 leading-relaxed">${phaseObj.desc}</p>
              </div>

              <div class="bg-[#1E1B3A] p-3 rounded-2xl border border-purple-900">
                <span class="text-purple-300 font-bold block mb-0.5">💭 Guía Emocional:</span>
                <p class="text-purple-100 leading-relaxed">${phaseObj.emotionGuidance}</p>
              </div>

              <div class="bg-[#1E1B3A] p-3 rounded-2xl border border-purple-900">
                <span class="text-purple-300 font-bold block mb-0.5">🧴 Enfoque de Piel y Cabello:</span>
                <p class="text-purple-100 leading-relaxed">${phaseObj.focus}</p>
              </div>
            </div>
          </div>

          <div class="bg-[#2A264D]/80 p-5 rounded-3xl border border-purple-500/20 mb-5">
            <h3 class="font-serif font-bold text-white text-sm mb-3">Fases de Septiembre 2026</h3>
            <div class="grid grid-cols-7 gap-1.5">
              ${daysArray.map(day => {
                const phase = SEPTEMBER_MOON_DATA[day];
                const isSelected = day === selectedDay;
                return `
                  <button onclick="selectMoonDay(${day})" class="aspect-square rounded-2xl flex flex-col items-center justify-center p-1 border transition-all ${
                    isSelected
                      ? 'bg-purple-600 text-white font-bold border-amber-300 shadow-md ring-2 ring-purple-400'
                      : 'bg-[#1E1B3A] border-purple-900/60 text-purple-300 hover:bg-purple-900/40'
                  }">
                    <span class="text-[9px] ${isSelected ? 'text-white' : 'text-purple-400'}">${day}</span>
                    <span class="text-sm leading-none mt-0.5">${phase.emoji}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <div class="bg-[#2A264D]/60 p-5 rounded-3xl border border-purple-500/20">
            <h3 class="font-serif font-bold text-white text-sm mb-3">Las 8 Fases del Ciclo Lunar 🌌</h3>
            <div class="space-y-3">
              ${MOON_PHASES.map(phase => `
                <div class="flex items-start space-x-3 p-3 bg-[#1E1B3A]/80 rounded-2xl border border-purple-900/50">
                  <span class="text-2xl">${phase.emoji}</span>
                  <div>
                    <h4 class="text-xs font-bold text-amber-200">${phase.name}</h4>
                    <p class="text-[11px] text-purple-200 mt-0.5 leading-snug">${phase.desc}</p>
                    <p class="text-[10px] text-purple-400 mt-1"><strong>Recomendación:</strong> ${phase.focus}</p>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function selectMoonDay(day) {
      state.selectedMoonDate = day;
      render();
    }

    // --- PANTALLA: AUDIO AMBIENTAL, SPOTIFY & YOUTUBE ---
    function renderAudio() {
      return `
        <div class="min-h-screen bg-gradient-to-b from-amber-50/40 via-rose-50/30 to-slate-50 pb-24 p-4 max-w-md mx-auto text-slate-800">
          <div class="mb-4">
            <span class="px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-semibold">Espacio Sonoro</span>
            <h1 class="text-2xl font-serif font-bold text-slate-800 mt-1">Audio y Relajación 🎧</h1>
            <p class="text-xs text-slate-500 font-light mt-0.5 leading-relaxed">
              Explora sonidos ambientales en vivo, listas de Spotify y episodios de YouTube para tus momentos de paz.
            </p>
          </div>

          <!-- SECCIÓN 1: GENERADOR AMBIENTAL EN VIVO -->
          <div class="mb-5">
            <h2 class="text-xs uppercase font-bold text-slate-400 tracking-wider mb-2 flex items-center gap-1">
              <span>🔊</span> <span>Paisajes Sonoros en Vivo</span>
            </h2>
            <div class="space-y-2.5">
              <div class="p-3.5 bg-white rounded-2xl border border-amber-100 flex justify-between items-center shadow-sm">
                <div>
                  <div class="text-xs font-bold text-slate-800">Gotas de Lluvia Suave 🌧️</div>
                  <div class="text-[10px] text-slate-500">Ruido blanco filtrado para relajación inmediata</div>
                </div>
                <button onclick="handleAudioPlay('rain')" class="p-2.5 bg-amber-200 hover:bg-amber-300 rounded-xl transition-colors">
                  <i data-lucide="${soundEngine.currentTrack === 'rain' && soundEngine.isPlaying ? 'pause' : 'play'}" class="w-4 h-4 text-amber-900"></i>
                </button>
              </div>

              <div class="p-3.5 bg-white rounded-2xl border border-purple-100 flex justify-between items-center shadow-sm">
                <div>
                  <div class="text-xs font-bold text-slate-800">Tono Armónico Sereno 🧘</div>
                  <div class="text-[10px] text-slate-500">Acorde armónico pacificador</div>
                </div>
                <button onclick="handleAudioPlay('drone')" class="p-3.5 bg-purple-200 hover:bg-purple-300 rounded-xl transition-colors">
                  <i data-lucide="${soundEngine.currentTrack === 'drone' && soundEngine.isPlaying ? 'pause' : 'play'}" class="w-4 h-4 text-purple-900"></i>
                </button>
              </div>

              <div class="p-3.5 bg-white rounded-2xl border border-rose-100 flex justify-between items-center shadow-sm">
                <div>
                  <div class="text-xs font-bold text-slate-800">Cuenco Tibetano 432Hz 🔔</div>
                  <div class="text-[10px] text-slate-500">Resonancia pacífica de sanación</div>
                </div>
                <button onclick="handleAudioPlay('bowl')" class="p-2.5 bg-rose-200 hover:bg-rose-300 rounded-xl transition-colors">
                  <i data-lucide="${soundEngine.currentTrack === 'bowl' && soundEngine.isPlaying ? 'pause' : 'play'}" class="w-4 h-4 text-rose-900"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- SECCIÓN 2: LISTAS Y CANCIONES DE SPOTIFY -->
          <div class="mb-5">
            <div class="flex items-center justify-between mb-2">
              <h2 class="text-xs uppercase font-bold text-emerald-600 tracking-wider flex items-center gap-1">
                <span>🟢</span> <span>Música & Playlists de Spotify</span>
              </h2>
              <span class="text-[10px] text-slate-400">Curaduría Bloom</span>
            </div>
            <div class="space-y-2.5">
              ${SPOTIFY_PLAYLISTS.map(item => `
                <div class="p-3.5 bg-white rounded-2xl border border-emerald-100/80 shadow-sm flex items-center justify-between">
                  <div class="pr-2">
                    <div class="text-xs font-bold text-slate-800 flex items-center gap-1">
                      <span>🎵</span> <span>${item.title}</span>
                    </div>
                    <div class="text-[10px] text-emerald-700 font-medium">${item.artist}</div>
                    <p class="text-[10px] text-slate-500 mt-0.5 font-light leading-tight">${item.desc}</p>
                  </div>
                  <a href="${item.link}" target="_blank" class="p-2.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-xl flex items-center justify-center transition-colors flex-shrink-0" title="Escuchar en Spotify">
                    <i data-lucide="external-link" class="w-4 h-4"></i>
                  </a>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- SECCIÓN 3: PODCASTS Y MEDITACIONES DE YOUTUBE -->
          <div class="mb-5">
            <div class="flex items-center justify-between mb-2">
              <h2 class="text-xs uppercase font-bold text-red-600 tracking-wider flex items-center gap-1">
                <span>🔴</span> <span>Podcasts & Meditaciones (YouTube)</span>
              </h2>
              <span class="text-[10px] text-slate-400">Canales Recomendados</span>
            </div>
            <div class="space-y-2.5">
              ${YOUTUBE_PODCASTS.map(pod => `
                <div class="p-3.5 bg-white rounded-2xl border border-red-100/80 shadow-sm flex items-center justify-between">
                  <div class="pr-2">
                    <div class="text-xs font-bold text-slate-800 flex items-center gap-1">
                      <span>🎙️</span> <span>${pod.title}</span>
                    </div>
                    <div class="text-[10px] text-red-600 font-medium">${pod.channel}</div>
                    <p class="text-[10px] text-slate-500 mt-0.5 font-light leading-tight">${pod.desc}</p>
                  </div>
                  <a href="${pod.link}" target="_blank" class="p-2.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl flex items-center justify-center transition-colors flex-shrink-0" title="Ver en YouTube">
                    <i data-lucide="youtube" class="w-4 h-4"></i>
                  </a>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function handleAudioPlay(track) {
      if (soundEngine.currentTrack === track && soundEngine.isPlaying) {
        soundEngine.stop();
      } else {
        if (track === 'rain') soundEngine.playRain();
        if (track === 'drone') soundEngine.playCalmDrone();
        if (track === 'bowl') soundEngine.playSingingBowl();
      }
      render();
    }

    function renderHabits() {
      const water = state.habits.find(h => h.id === 'water');
      return `
        <div class="min-h-screen bg-gradient-to-b from-teal-50/40 via-rose-50/30 to-slate-50 pb-24 p-4 max-w-md mx-auto text-slate-800">
          <h1 class="text-2xl font-serif font-bold text-slate-800 mb-4">Hábitos Diarios 🌱</h1>

          <div class="p-4 bg-white rounded-3xl border border-teal-100 shadow-sm flex items-center justify-between mb-3">
            <div>
              <div class="text-sm font-bold text-slate-800">Meta de Agua 💧</div>
              <div class="text-xs text-slate-500">${water.count} / 8 vasos hoy</div>
            </div>
            <div class="flex items-center space-x-2">
              <button onclick="updateWater(-1)" class="w-8 h-8 rounded-full bg-slate-100 font-bold">-</button>
              <button onclick="updateWater(1)" class="w-8 h-8 rounded-full bg-teal-500 text-white font-bold">+</button>
            </div>
          </div>
        </div>
      `;
    }

    function updateWater(delta) {
      const water = state.habits.find(h => h.id === 'water');
      water.count = Math.max(0, Math.min(12, water.count + delta));
      render();
    }

    // --- PANTALLA DE PERFIL Y CÓDIGO QR CON REDIRECCIÓN WEB ---
    function renderProfile() {
      return `
        <div class="min-h-screen bg-gradient-to-b from-rose-50/40 via-purple-50/30 to-slate-50 pb-24 p-4 max-w-md mx-auto text-slate-800">
          <h1 class="text-2xl font-serif font-bold text-slate-800 mb-4">Perfil y Ajustes 👤</h1>

          <div class="bg-white rounded-3xl p-5 border border-rose-100 shadow-sm mb-4">
            <label class="text-xs font-semibold text-slate-700 block mb-1">Nombre o Título Preferido</label>
            <input type="text" value="${state.userName || ''}" onchange="state.userName=this.value; saveProfile(); showToast('Nombre actualizado');" class="w-full p-3 text-xs bg-slate-50 rounded-2xl border border-slate-200" placeholder="Escribe tu nombre..." />
          </div>

          <!-- Botón y Código QR de Fuentes y Referencias -->
          <div class="bg-white rounded-3xl p-5 border border-purple-100 shadow-sm mb-4">
            <div class="flex items-center justify-between mb-2">
              <div>
                <h3 class="font-serif font-bold text-slate-800 text-sm">Fuentes & Redirección Web 🌐</h3>
                <p class="text-xs text-slate-500 mt-0.5">Escanea o haz clic para abrir la web de fuentes médicas (AAD).</p>
              </div>
            </div>

            <!-- Código QR Generado e Interactivo -->
            <div class="my-3 flex flex-col items-center justify-center p-4 bg-purple-50/50 rounded-2xl border border-purple-100">
              <a href="${EXTERNAL_INFO_URL}" target="_blank" id="qr-code-references" class="p-2 bg-white rounded-xl shadow-sm border border-purple-200 block cursor-pointer" title="Abrir página oficial de fuentes AAD"></a>
              <a href="${EXTERNAL_INFO_URL}" target="_blank" class="text-[11px] text-purple-700 font-bold mt-2 hover:underline">Escanea o Toca Aquí para Abrir la Web ↗</a>
            </div>

            <div class="space-y-2">
              <a href="${EXTERNAL_INFO_URL}" target="_blank" class="w-full py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-semibold text-xs rounded-2xl flex items-center justify-center space-x-1 shadow-sm transition-colors text-center block">
                <span>Abrir Web Oficial de Fuentes (AAD) ↗</span>
              </a>

              <button onclick="openReferencesModal()" class="w-full py-2.5 bg-purple-50 hover:bg-purple-100 text-purple-800 font-semibold text-xs rounded-2xl border border-purple-200 transition-colors">
                Ver Resumen de Referencias en Pantalla
              </button>
            </div>
          </div>

          <button onclick="localStorage.clear(); location.reload();" class="w-full py-3 bg-rose-100 text-rose-700 font-medium text-xs rounded-2xl">
            Reiniciar Aplicación (Volver al Día 1)
          </button>

          <!-- Modal de Referencias incorporado dinámicamente -->
          ${state.showReferencesModal ? renderReferencesModal() : ''}
        </div>
      `;
    }

    function openReferencesModal() {
      state.showReferencesModal = true;
      render();
    }

    function closeReferencesModal() {
      state.showReferencesModal = false;
      render();
    }

    function renderReferencesModal() {
      return `
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-3xl p-5 max-w-sm w-full max-h-[80vh] overflow-y-auto shadow-2xl border border-rose-100">
            <div class="flex justify-between items-center mb-3 border-b pb-2">
              <h3 class="font-serif font-bold text-slate-800 text-sm flex items-center gap-1.5">
                <span>📚</span>
                <span>Fuentes y Referencias</span>
              </h3>
              <button onclick="closeReferencesModal()" class="text-slate-400 hover:text-slate-600 font-bold text-sm">✕</button>
            </div>

            <div class="space-y-3 text-xs text-slate-600">
              <div class="p-3 bg-rose-50/70 rounded-2xl border border-rose-100">
                <span class="font-bold text-rose-900 block">1. Cuidado de la Piel (Skincare)</span>
                <p class="mt-0.5 text-[11px] leading-relaxed">
                  <strong>American Academy of Dermatology (AAD):</strong> Recomendaciones esenciales de fotoprotección diaria con protector solar de amplio espectro (FPS 30+), limpieza suave y mantenimiento de la barrera cutánea.
                </p>
                <a href="${EXTERNAL_INFO_URL}" target="_blank" class="mt-1 inline-block text-[10px] font-bold text-rose-700 underline">Visitar sitio web oficial ↗</a>
              </div>

              <div class="p-3 bg-purple-50/70 rounded-2xl border border-purple-100">
                <span class="font-bold text-purple-900 block">2. Bienestar Emocional y Respiración</span>
                <p class="mt-0.5 text-[11px] leading-relaxed">
                  <strong>Dr. Andrew Weil (Técnica 4-7-8) & APA:</strong> La respiración rítmica regulada activa el sistema parasimpático para reducir los niveles de cortisol y la ansiedad. El diario reflexivo promueve la autorregulación emocional.
                </p>
              </div>

              <div class="p-3 bg-emerald-50/70 rounded-2xl border border-emerald-100">
                <span class="font-bold text-emerald-900 block">3. Salubridad Capilar</span>
                <p class="mt-0.5 text-[11px] leading-relaxed">
                  <strong>Journal of Cosmetic Dermatology:</strong> Guías de cuidado según porosidad del cabello, uso de lípidos naturales para sellar humedad en hebras rizadas y masajes capilares suaves para la estimulación de la microcirculación.
                </p>
              </div>

              <div class="p-3 bg-amber-50/70 rounded-2xl border border-amber-100">
                <span class="font-bold text-amber-900 block">4. Cronobiología y Hábitos</span>
                <p class="mt-0.5 text-[11px] leading-relaxed">
                  <strong>Journal of Biological Rhythms:</strong> La alineación con ciclos de descanso regular y la hidratación continua apoyan la restauración fisiológica celular.
                </p>
              </div>
            </div>

            <button onclick="closeReferencesModal()" class="w-full mt-4 py-2.5 bg-slate-800 text-white rounded-2xl text-xs font-semibold">
              Entendido
            </button>
          </div>
        </div>
      `;
    }

    // Inicializar la App al Cargar el DOM
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
